name: Build Android APKs (Patient & Phlebotomist Courier)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Accept Android SDK Licenses
        run: |
          SDKM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Build & Sync Customer Patient Bundle
        env:
          VITE_APP_FLAVOR: patient
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}
        run: |
          npm run build:patient
          npx cap sync android

      - name: Assemble Customer Patient APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assemblePatientDebug --no-daemon

      - name: Upload Customer Patient APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LabConnect-Patient-APK
          path: android/app/build/outputs/apk/patient/debug/app-patient-debug.apk

      - name: Build & Sync Phlebotomist Courier Bundle
        env:
          VITE_APP_FLAVOR: courier
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}
        run: |
          npm run build:courier
          npx cap sync android

      - name: Assemble Phlebotomist Courier APK
        working-directory: android
        run: |
          ./gradlew assembleCourierDebug --no-daemon

      - name: Upload Phlebotomist Courier APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LabConnect-Phlebotomist-Courier-APK
          path: android/app/build/outputs/apk/courier/debug/app-courier-debug.apk
